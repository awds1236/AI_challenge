# 서무비서 AI Windows 설치 파일 만들기
#   - SeomuAI.exe (PyInstaller, Python 설치 불필요) + 내장 AI 엔진(llama.cpp 공식 CPU 빌드) + uiautomation
#   - SeomuAI-Setup.exe (Inno Setup): 설치하고 바로 실행, 관리자 권한 불필요
#   - 설치·실행 시험 뒤 GitHub Releases에 올린다
# 실행: 기본 브랜치에 병합되면 자동 (또는 Actions → "Windows 설치 파일" → Run workflow, v* 태그)
name: Windows 설치 파일

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # 기본 브랜치에 병합되면 최신 설치 파일을 새로 만든다 (문서만 바뀐 경우는 빼고)
    branches: ["claude/focused-clarke-fmtkop", "main"]
    paths-ignore: ["docs/**", "**.md", "sample_data/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          # 브라우저 연동(playwright)은 화면에서 뺐으므로 넣지 않는다 (설치 파일 크기 절약)
          python -m pip install pyinstaller pywebview pypdf truststore pillow olefile openpyxl uiautomation lxml

      - name: 시험 (pytest)
        # CI에는 사람이 없는 화면이라 실제 창 조작(앞으로 가져오기·Ctrl+A/C·UI Automation)을 끈다
        #   (러너 콘솔에 키 입력이 들어가면 러너가 끊길 수 있음)
        timeout-minutes: 10
        env:
          SEOMU_NO_FOREGROUND: "1"
          SEOMU_DISABLE_UIA: "1"
          SEOMU_HOME: ${{ runner.temp }}\seomu_home
          SEOMU_DOWNLOADS: ${{ runner.temp }}\seomu_dl
        run: |
          python -m pip install pytest pytest-timeout
          python -m pytest -q -p no:cacheprovider --timeout=120
        continue-on-error: true

      - name: 내장 AI 엔진 받기 (llama.cpp 공식 CPU 빌드)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 최근 릴리스를 차례로 살펴 Windows CPU 빌드(zip)를 찾는다 (파일 이름 규칙이 바뀌어도: bin-win-cpu-x64 / win-cpu-x64 / win-avx2-x64)
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "SeomuAI-build" }
          $rels = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=15" -Headers $hdr
          $gpu = "cuda|cudart|vulkan|sycl|hip|rocm|opencl|kompute|arm64|openvino|musa|cann"
          $rel = $null; $asset = $null
          foreach ($r in $rels) {
            if ($r.draft) { continue }
            $win = $r.assets | Where-Object { $_.name -match "win" -and $_.name -match "\.zip$" }
            Write-Host "$($r.tag_name): $(($win | ForEach-Object { $_.name }) -join ', ')"
            $pick = $win | Where-Object { $_.name -match "(cpu|avx2|noavx|x64)" -and $_.name -match "x64" -and $_.name -notmatch $gpu } |
              Sort-Object { if ($_.name -match "cpu") { 0 } elseif ($_.name -match "avx2") { 1 } else { 2 } } | Select-Object -First 1
            if ($pick) { $rel = $r; $asset = $pick; break }
          }
          if (-not $asset) { throw "최근 llama.cpp 릴리스에서 Windows CPU 빌드를 찾지 못했습니다" }
          Write-Host "엔진: $($rel.tag_name) / $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama.zip
          Expand-Archive llama.zip -DestinationPath engine_tmp -Force
          $server = Get-ChildItem engine_tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) { throw "압축 안에 llama-server.exe가 없습니다" }
          New-Item -ItemType Directory -Force engine | Out-Null
          Copy-Item (Join-Path $server.DirectoryName "*") engine -Recurse -Force
          "$($rel.tag_name)" | Out-File engine\VERSION.txt -Encoding utf8
          Get-ChildItem engine | Select-Object Name, Length | Format-Table

      - name: 실행 파일 만들기 (SeomuAI.exe)
        timeout-minutes: 20
        run: python tools/build_exe.py --no-playwright --no-zip

      - name: 실행 시험 (프로그램이 켜지고 화면을 내주는지)
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath dist\SeomuAI\SeomuAI.exe -ArgumentList "--no-open","--port","18765" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:18765/" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200 -and $r.Content -match "서무비서") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "SeomuAI.exe가 40초 안에 화면을 내주지 않았습니다" }
          & dist\SeomuAI\engine\llama-server.exe --version
          Write-Host "실행 시험 통과"

      - name: 설치 파일 만들기 (SeomuAI-Setup.exe)
        timeout-minutes: 10
        run: |
          $ver = (python -c "import seomu; print(seomu.__version__)").Trim()
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVer=$ver" tools\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 파일을 만들지 못했습니다" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item dist\SeomuAI-Setup.exe | Select-Object Name, Length

      - name: 설치 시험 (조용히 설치 → 설치된 프로그램 실행)
        timeout-minutes: 5
        run: |
          $dir = "$env:RUNNER_TEMP\SeomuAI-test"
          $p = Start-Process -FilePath dist\SeomuAI-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "설치 실패 (코드 $($p.ExitCode))" }
          if (-not (Test-Path "$dir\SeomuAI.exe")) { throw "설치 폴더에 SeomuAI.exe가 없습니다" }
          $app = Start-Process -FilePath "$dir\SeomuAI.exe" -ArgumentList "--no-open","--port","18766" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:18766/" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "설치한 프로그램이 켜지지 않았습니다" }
          Write-Host "설치 시험 통과"

      - uses: actions/upload-artifact@v4
        with:
          name: SeomuAI-Setup
          path: dist/SeomuAI-Setup.exe

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: 서무비서 AI ${{ env.VERSION }} (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/SeomuAI-Setup.exe
          body: |
            ## 설치 방법
            1. 아래 **SeomuAI-Setup.exe**를 받아 실행합니다. (관리자 권한 없이 설치됩니다)
            2. '알 수 없는 게시자' 경고가 뜨면 **[추가 정보] → [실행]**을 누르세요. (서명하지 않은 프로그램이라 뜨는 안내입니다)
            3. 설치가 끝나면 서무비서 AI가 바로 실행됩니다. 바탕화면·시작 메뉴에 바로가기가 생깁니다.
            4. 처음 한 번 **설정 → AI 모델**에서 Gemma 4 E2B의 **[받기]**를 눌러 AI 모델(약 3.3GB)을 받습니다.
               인터넷이 안 되는 PC는 설치 폴더(%LOCALAPPDATA%\Programs\SeomuAI)의 `models` 폴더에 .gguf 파일을 넣으면 됩니다.

            - 들어 있는 것: 서무비서 AI, 내장 AI 엔진(llama.cpp 공식 CPU 빌드), 화면 글자 읽기(uiautomation)
            - 들어 있지 않은 것: AI 모델 파일(용량이 커서 첫 실행 때 받음)
            - 데이터: 설정·기록은 %LOCALAPPDATA%\SeomuAI, 수집한 공문은 다운로드\서무비서
